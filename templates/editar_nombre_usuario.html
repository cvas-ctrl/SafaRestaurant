{% extends "base.html" %}

{% block content %}
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">
                <h1 class="text-center mb-4 text-success">Editar Nombre de Usuario</h1>
                
                {% if messages %}
                    <div class="alert alert-dismissible fade show" role="alert">
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}

                <form method="post" action="{% url 'editar_nombre_usuario' %}">
                    {% csrf_token %}
                    <div class="form-group mb-3">
                        <label for="nombre" class="form-label">Nuevo Nombre de Usuario:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ request.user.nombre }}" required>
                        <div class="form-text">Ingrese su nuevo nombre de usuario.</div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary me-2">Guardar Cambios</button>
                        <a href="{% url 'perfil' %}" class="btn btn-secondary">Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
