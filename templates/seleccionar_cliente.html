{% extends "base.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/style_seleccionar_cliente.css' %}">
{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Asignar cliente a Mesa {{ mesa.numero }}</h2>
    
    <div class="list-group mt-3">
        {% for cliente in clientes %}
        <form method="post" action="{% url 'asignar_cliente' mesa.id %}" class="d-inline">
            {% csrf_token %}
            <input type="hidden" name="cliente_id" value="{{ cliente.id }}">
            <button type="submit" class="list-group-item list-group-item-action w-100 text-start">
                {{ cliente.nombre }} {{ cliente.apellidos }}
                <small class="text-muted">({{ cliente.dni }})</small>
            </button>
        </form>
        {% empty %}
        <div class="alert alert-warning">No hay clientes registrados</div>
        {% endfor %}
    </div>
    
    <a href="{% url 'camarero' %}" class="btn btn-secondary mt-3">Cancelar</a>
</div>
{% endblock %}
