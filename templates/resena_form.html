{% extends "base.html" %}
{% load static %}

{% block content %}
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="container mt-4">
        <h1 style="color: #28c112" >{{ request.resolver_match.url_name|cut:"_"|title }} Reseña</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Guardar Reseña</button>
            <a href="{% url 'mis_resenas' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
